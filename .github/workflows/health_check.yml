name: Periodic Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL health
        # --fail: exits with an error code if the HTTP status isn't 200
        # --retry 3: tries up to 3 times
        # --retry-delay 5: waits 5 seconds between retries
        run: curl --fail --retry 3 --retry-delay 5 --retry-all-errors https://part11-tp2o.onrender.com/health

      - name: Notify Failure to Discord
        if: ${{ failure() }}
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{"content": "Health Check Failed! The application live endpoint is unreachable or returning an error."}' \
          ${{ secrets.DISCORD_WEBHOOK }}